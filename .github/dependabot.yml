version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors da stack central não chegam por PR automático: precisam de migração planejada
    # (ex.: eslint-plugin-react-hooks 7 reprova Header/index.tsx por set-state-in-effect e
    # derrubou o build do preview na Vercel). Minor/patch dessas libs continuam entrando.
    ignore:
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-plugin-react-hooks
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
