name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      # Build contra porta fechada de propósito: as 4 listagens têm `.catch()` no call site e caem
      # no fallback (`LISTING_UNAVAILABLE_MESSAGE`) em vez de quebrar o build, então o `next build`
      # passa sem backend e o CI não depende do deploy gratuito do Render (sem SLA, cold start de
      # 30-60s — ver docs/limitacoes-conhecidas.md). Pega o que só aparecia no deploy da Vercel:
      # rota dinâmica sem Suspense, import quebrado, erro de config. Limite: só o caminho de
      # fallback das listagens é pré-renderizado, então uma regressão no formato da resposta do
      # backend (`docs`/`total`/`itemsPerPage`) não aparece aqui — isso é coberto por teste.
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:1/v1

  # Job separado: um advisory novo pode ser publicado a qualquer hora e derrubaria um PR sem
  # relação com o diff — assim aparece como check próprio, sem mascarar tsc/lint/test/build.
  # Limiar `high`: critical e high falham; moderate/low não.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # `pnpm audit` só lê o lockfile — sem setup-node/cache/install.
      - run: pnpm audit --prod --audit-level=high
