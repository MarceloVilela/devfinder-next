name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test

# "pnpm build" fica fora do gate de PR de propósito: as páginas de listagem ("/", "/user",
# "/channel", "/video") são Server Components que buscam com `fetch(..., { next: { revalidate }
# })` direto em NEXT_PUBLIC_API_URL (App Router, não mais getStaticProps do Pages Router) — o
# `next build` ainda executa esse fetch em build-time por causa do ISR, então só passa com um
# backend real e acessível no ar (verificado localmente com devfinder-api rodando). O único
# backend público hoje é o deploy de referência em onrender.com — plano gratuito, sem SLA,
# sujeito a cold start; nada garante que responda a tempo durante o build de um CI de terceiros.
# Gatear o PR nisso tornaria o CI refém da disponibilidade de um serviço externo fora do
# controle deste repositório.
